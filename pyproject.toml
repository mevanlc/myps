[project]
name = "myps"
version = "0.1.0"
description = "Process tree viewer for current user with filtering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psutil>=7.0.0",
    "rich>=14.1.0",
]

[project.scripts]
myps = "myps:cli.main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
myps = ["config.sample.toml"]

[dependency-groups]
dev = [
    "ruff>=0.13.2",
    "types-psutil>=7.0.0.20251001",
    "pytest>=8.4.2",
]
